<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard XCODE</title>

    <link rel="stylesheet" href="../css/data_buku.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo-sidebar">
        <img src="../image/Xcode.png" alt="XCODE Logo" class="logo" />
      </div>

      <nav class="nav-menu">
        <a href="dashboard_admin.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/25/25694.png"
            class="nav-icon"
          />
          <span>Dashboard</span>
        </a>

        <a href="data_admin.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/4794/4794936.png"
            class="nav-icon"
          />
          <span>Data Admin</span>
        </a>

        <a href="data_user.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"
            class="nav-icon"
          />
          <span>Data User</span>
        </a>

        <a href="data_buku.html" class="nav-item active">
          <img
            src="https://cdn-icons-png.flaticon.com/512/29/29302.png"
            class="nav-icon"
          />
          <span>Data Buku</span>
        </a>

        <a href="data_peminjaman_admin.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/2693/2693507.png"
            class="nav-icon"
          />
          <span>Data Peminjaman</span>
        </a>

        <a href="#" class="nav-item">
          <img src="../image/logout.svg" class="nav-icon" />
          <span id="logoutBtn">Logout</span>
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <div class="main-container">
      <header>
        <h1>Update Buku</h1>

        <div class="user-info">
          <img src="../image/profile.svg" class="avatar" />
          <div class="user-details">
            <strong id="nama-pengguna">Dito Abod</strong>
            <span id="email-pengguna">gild@gmail.com</span>
          </div>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="content">
        <div class="container mt-3">
          <div class="row g-4">
            <!-- CARD FOTO -->
            <div class="col-md-4">
              <div class="card shadow-sm p-3">
                <div class="text-center">
                  <img
                    src=""
                    alt="Cover Buku"
                    class="img-fluid rounded"
                    style="max-height: 350px; object-fit: cover"
                    id="gambar_buku"
                  />
                </div>
                <div class="mt-3">
                  <input
                    type="file"
                    class="form-control"
                    id="gambar_upload"
                    accept="image/*"
                  />
                </div>
              </div>
            </div>

            <!-- CARD DETAIL -->
            <div class="col-md-8">
              <div class="card shadow-sm p-4">
                <h5 class="mb-3">Update Buku</h5>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Judul Buku</label>
                    <input type="text" class="form-control" id="judul" />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Penulis</label>
                    <input type="text" class="form-control" id="penulis" />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Kategori</label>
                    <select id="kategori" class="form-select">
                      <option value="">-- Pilih Kategori --</option>
                    </select>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Penerbit</label>
                    <input type="text" class="form-control" id="penerbit" />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Tahun Terbit</label>
                    <input
                      type="number"
                      class="form-control"
                      id="tahun_terbit"
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Total Stock</label>
                    <input type="number" class="form-control" id="total_stok" />
                  </div>

                  <div class="col-md-12 mb-3">
                    <label class="form-label">Deskripsi</label>
                    <textarea
                      class="form-control"
                      rows="3"
                      style="resize: none"
                      id="deskripsi"
                    ></textarea>
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">
                  <button
                    class="btn btn-secondary"
                    onclick="window.location.href='data_buku.html'"
                  >
                    <i class="bi bi-arrow-left"></i> Kembali
                  </button>
                  <button class="btn btn-secondary" id="btnUpdate">Update</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/update_buku_admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
  </body>
</html>
