<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Peminjaman</title>
    <link rel="stylesheet" href="../css/detail_peminjaman_user.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <img src="../image/Xcode.png" alt="Logo" />
      </div>

      <button class="nav-toggle" aria-label="toggle navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <nav class="nav-links">
        <a href="Home.html">Home</a>
        <a href="edit_profile_user.html">Profile</a>
        <a href="#">Favorite</a>
        <a href="kategori.html">Categories</a>
      </nav>

      <div class="profile" id="profileBtn">
        <img src="../image/bahlil.png" alt="Profil" />
        <div>
          <h4 id="nama-pengguna"></h4>
          <p id="email-pengguna"></p>
        </div>
      </div>
    </header>

    <!-- Back Button -->
    <div class="back-section">
      <button class="back-button" onclick="window.history.back()"></button>
    </div>

    <!-- Main Content -->
    <main class="container">
      <div class="book-section">
        <div class="book-cover">
          <img src="" alt="" id="gambar"/>
        </div>

        <div class="book-info">
          <h3>Peminjaman</h3>
          <div class="form-group">
            <label for="ktm">Judul Buku</label>
            <input type="text" id="judul" disabled />
          </div>

          <div class="form-group">
            <label for="tgl-pinjam">Tanggal Peminjaman</label>
            <input type="date" id="tgl-pinjam" disabled />
          </div>

          <div class="form-group">
            <label for="tgl-kembali">Tanggal Pengembalian</label>
            <input type="date" id="tgl-kembali" disabled />
          </div>

          <button class="btn-ajukan" id="ajukan">AJUKAN</button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/detail_peminjaman_user.js"></script>
  </body>
</html>
