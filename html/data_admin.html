<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard XCODE</title>
    <link rel="stylesheet" href="../css/data_admin.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
<body>

    <aside class="sidebar">
        <div class="logo-sidebar">
            <img src="../image/Xcode.png" alt="XCODE Logo" class="logo">
        </div>
        <nav class="nav-menu">
            <a href="dashboard_admin.html" class="nav-item ">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="icon" class="nav-icon">
                <span>Dashboard</span>
            </a>
            <a href="data_admin.html" class="nav-item">
                <img src="https://cdn-icons-png.flaticon.com/512/4794/4794936.png" alt="icon" class="nav-icon">
                <span>Data Admin</span>
            </a>
            <a href="data_user.html" class="nav-item">
                <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="icon" class="nav-icon">
                <span>Data User</span>
            </a>
            <a href="data_buku.html" class="nav-item">
                <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="icon" class="nav-icon">
                <span>Data Buku</span>
            </a>
            <a href="data_peminjaman_admin.html" class="nav-item">
                <img src="https://cdn-icons-png.flaticon.com/512/2693/2693507.png" alt="icon" class="nav-icon">
                <span>Data Peminjaman</span> 
            </a>
            <a href="#" class="nav-item">
                <img src="../image/logout.svg" alt="icon" class="nav-icon">
                <span id="logoutBtn">Logout</span>
            </a>
        </nav>
    </aside>

    <div class="main-container">
        
        <header>
            <h1>Data Admin</h1>
            <div class="admin-info">
                <img src="../image/profile.svg" alt="Avatar" class="avatar">
                <div class="admin-details">
                    <strong id="nama-pengguna">Dito Abod</strong>
                    <span id="email-pengguna">gild@gmail.com</span>
                </div>
            </div>
        </header>

        <main class="content">
            

            <div class="content-header">
                <div class="filters">
                    
                    <div class="filter-wrapper">
                        <img src="https://cdn.pixabay.com/photo/2021/07/02/04/48/search-6380865_640.png" class="filter-icon search-icon" alt="Search">
                        <input type="search" placeholder="Search">
                    </div>

                </div>
                <div class="actions">
                    
                    <button class="btn-export">
                        <span>Export</span>
                        <i class="bi bi-file-earmark-excel"></i>
                    </button>
                    
                    <button class="btn btn-primary" id="tambahAdminBtn">
                        <span><a href="tambah_admin.html">Tambah Admin</a></span>
                        <i class="bi bi-plus-lg"></i>
                    </button>

                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Depan</th>
                            <th>Nama Belakang</th>
                            <th>Email</th>
                            <th>Password</th>
                            <th>Role</th>
                            <th class="action-header">Aksi</th> 
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/data_admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
