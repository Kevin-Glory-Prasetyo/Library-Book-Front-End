<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCODE-BOOK</title>
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <img src="../image/xcode.png" alt="Logo">
    </div>

    <button class="nav-toggle" aria-label="toggle navigation">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav-links">
      <a href="Home.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="kategori.html">Kategori</a>
    </nav>
    

    <div class="profile" id="profileBtn">
      <img src="../image/kevinstiker.png" alt="Profil">
      <div>
        <h4 id="nama-pengguna">Kevin Glory</h4>
        <p id="email-pengguna">Kevin@gmail.com</p>
      </div>
      <span class="arrow-down"></span>
    </div>

    <!-- DROPDOWN PROFILE -->
    <div class="dropdown-menu" id="dropdownMenu">
      <a href="EDIT-PROFILE.html">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </header>
  <main>
  <div class="profile-card">
    <div class="profile-card-header">
      <div class="user-info-left">
        <form id="uploadForm" enctype="multipart/form-data">
          <label for="user_image">
            <img id="profile-preview" src="../image/profile.png" alt="Foto Profil" />
          </label>
          <input type="file" id="user_image" name="user_image" accept="image/*" hidden />
        </form>
        <div class="user-details">
          <h3>Glen Daud</h3>
          <p>glendaud@gmail.com</p>
        </div>
      </div>
      <button type="submit" form="editProfileForm" class="save-btn">Simpan</button>
    </div>

    <form id="editProfileForm" enctype="multipart/form-data" class="profile-form">
      <div class="form-grid">
        <div class="form-column">
          <div class="form-group">
            <label for="user_first_name">Nama Depan</label>
            <input type="text" id="user_first_name" name="user_first_name" placeholder="Nama Depan" />
          </div>

          <div class="form-group">
            <label for="user_last_name">Nama Belakang</label>
            <input type="text" id="user_last_name" name="user_last_name" placeholder="Nama Belakang" />
          </div>
          <div class="form-group">
            <label for="user_phone">Nomor Telepon</label>
            <input type="text" id="user_phone" name="user_phone" placeholder="Nomor Telepon" />
          </div>
        </div>

        <div class="form-column">
          <div class="form-group">
            <label for="user_email">Email</label>
            <input type="email" id="user_email" name="user_email" placeholder="Alamat Email" />
          </div>

          <div class="form-group">
            <label for="user_password">Password Baru</label>
            <input type="password" id="user_password" name="user_password" placeholder="Masukkan Password Baru" />
          </div>
        </div>
      </div>
    </form>
  </div>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
