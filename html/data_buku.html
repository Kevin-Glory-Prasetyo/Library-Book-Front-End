<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard XCODE</title>
    <link rel="stylesheet" href="../css/data_buku.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <aside class="sidebar">
      <div class="logo-sidebar">
        <img src="../image/Xcode.png" alt="XCODE Logo" class="logo" />
      </div>

      <nav class="nav-menu">
        <a href="dashboard_admin.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/25/25694.png"
            alt="icon"
            class="nav-icon"
          />
          <span>Dashboard</span>
        </a>
        <a href="data_admin.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/4794/4794936.png"
            alt="icon"
            class="nav-icon"
          />
          <span>Data Admin</span>
        </a>
        <a href="data_user.html" class="nav-item active">
          <img
            src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"
            alt="icon"
            class="nav-icon"
          />
          <span>Data User</span>
        </a>
        <a href="data_buku.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/29/29302.png"
            alt="icon"
            class="nav-icon"
          />
          <span>Data Buku</span>
        </a>
        <a href="data_peminjaman_admin.html" class="nav-item">
          <img
            src="https://cdn-icons-png.flaticon.com/512/2693/2693507.png"
            alt="icon"
            class="nav-icon"
          />
          <span>Data Peminjaman</span>
        </a>
        <a href="#" class="nav-item">
          <img src="../image/logout.svg" alt="icon" class="nav-icon" />
          <span id="logoutBtn">Logout</span>
        </a>
      </nav>
    </aside>

    <div class="main-container">
      <header>
        <h1>Data Buku</h1>
        <div class="user-info">
          <img src="../image/profile.svg" alt="Avatar" class="avatar" />
          <div class="user-details">
            <strong id="nama-pengguna">Dito Abod</strong>
            <span id="email-pengguna">gild@gmail.com</span>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="content-header">
          <div class="filters">
            <div class="filter-wrapper">
              <img
                src="https://cdn.pixabay.com/photo/2021/07/02/04/48/search-6380865_640.png"
                class="filter-icon search-icon"
                alt="Search"
              />
              <input type="search" placeholder="Search" />
            </div>
            <div class="actions">
              <button class="btn-export">
                <span>Export</span>
                <i class="bi bi-file-earmark-excel"></i>
              </button>
              <button
                onclick="window.location.href='insert_buku_admin.html'"
                class="btn-primary"
                id="tambahUserBtn"
              >
                <span>Tambah Buku</span>
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Judul Buku</th>
                <th>Penulis</th>
                <th>Kategori</th>
                <th>Tahun Terbit</th>
                <th>Penerbit</th>
                <th>Total Stok</th>
                <th>Stok Tersedia</th>
                <th>Dipinjam</th>
                <th class="action-header">Aksi</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3 pt-2">
            <div class="text-secondary small" id="page-info">
                Showing 0 entries
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0" id="pagination">
                    </ul>
            </nav>
        </div>

      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/data_buku.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
