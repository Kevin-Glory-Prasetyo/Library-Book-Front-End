<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCODE - Tambah Data Buku</title>
    <link rel="stylesheet" href="../css/edit_data_buku.css">
</head>
<body>
    <header class="header">
        <div class="header-right">
            <img src="https://cdn-icons-png.flaticon.com/512/281/281769.png" alt="Gmail" class="gmail-icon">
            <div class="user-profile">
                <img src="https://via.placeholder.com/40" alt="User" class="user-avatar">
                <div class="user-info">
                    <span class="user-name">Glen Daud</span>
                    <span class="user-email">glen@gmail.com</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="logo-sidebar">
                <img src="../image/Xcode.png" alt="XCODE Logo" class="logo">
            </div>
            <nav class="nav-menu">
                <a href="dashboard_admin.html" class="nav-item active">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="icon" class="nav-icon">
                    <span>Dashboard</span>
                </a>
                <a href="data_admin.html" class="nav-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/4794/4794936.png" alt="icon" class="nav-icon">
                    <span>Data Admin</span>
                </a>
                <a href="data_user.html" class="nav-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="icon" class="nav-icon">
                    <span>Data User</span>
                </a>
                <a href="data_buku.html" class="nav-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/29/29302.png" alt="icon" class="nav-icon">
                    <span>Data Buku</span>
                </a>
                <a href="data_peminjaman_admin.html" class="nav-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/2693/2693507.png" alt="icon" class="nav-icon">
                    <span>Peminjaman</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="form-card"> 
                <div class="form-card-header">
                    Tambah Buku
                </div>
                <div class="form-card-body">
                    <form id="addBookForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="judulBuku">Judul Buku</label>
                                <input type="text" id="judulBuku" placeholder="Masukkan judul buku">
                            </div>
                            <div class="form-group">
                                <label for="kategori">Kategori</label>
                                <input type="text" id="kategori" placeholder="Masukkan kategori">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="penulis">Penulis</label>
                                <input type="text" id="penulis" placeholder="Masukkan nama penulis">
                            </div>
                            <div class="form-group">
                                <label for="penerbit">Penerbit</label>
                                <input type="text" id="penerbit" placeholder="Masukkan nama penerbit">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="stokBuku">Stok Buku</label>
                                <input type="number" id="stokBuku" placeholder="Masukkan jumlah stok" min="0">
                            </div>
                            <div class="form-group">
                                <label for="gambar">Gambar</label>
                                <div class="file-upload-container">
                                    <div class="file-input-area">
                                        <input type="file" id="fileInput" accept="image/png,image/jpeg" hidden>
                                        
                                        <label for="fileInput" class="file-label">
                                            <img src="https://cdn-icons-png.flaticon.com/512/126/126477.png" alt="upload icon">
                                            Choose File
                                        </label>
                                        
                                        <div class="file-info" id="fileInfo">
                                            <span>Name: -</span>
                                            <span>Size: -</span>
                                        </div>
                                    </div>
                                    <div class="image-preview" id="imagePreviewBox"></div>
                                </div>
                                </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-tambah">Tambah</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/edit_data_buku.js"></script>
</body>
</html>
