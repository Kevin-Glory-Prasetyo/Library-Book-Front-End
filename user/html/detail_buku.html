<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/detail_buku.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

     <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body>

   <header class="navbar">
  <div class="logo">
    <img src="../image/xcode.png" alt="Logo">
  </div>

  <!-- MOBILE TOGGLE -->
  <button class="nav-toggle" aria-label="toggle navigation">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <!-- NAV LINKS SESUAI CSS -->
  <nav class="nav-links">
    <a href="Home.html">Home</a>
    <a href="edit_profile_user.html">Profile</a>
    <a href="#">Favorite</a>
    <a href="kategori.html">Categories</a>
    <a href="histori_peminjaman_user.html">History</a>
  </nav>

  <!-- PROFILE SESUAI CSS -->
  <div class="profile" id="profileBtn">
    <img src="https://i.pravatar.cc/40?u=KevinGlory" alt="Profil" id="navbarProfileImg">

    <div class="profile-info">
      <h4 id="navbarProfileName">Kevin Glory</h4>
      <!-- <p id="navbarProfileName">Kevin@gmail.com</p> -->
    </div>

    <span class="arrow-down"></span>
  </div>

  <!-- DROPDOWN SESUAI CSS -->
  <div class="dropdown-menu" id="dropdownMenu">
    <a href="edit_profile_user.html">Profile</a>
    <a href="login.html" id="logoutBtn">Logout</a>
  </div>
</header>



    <main class="container">
        <a href="kategori.html" class="back-button"><i class="bi bi-caret-left-fill"></i>Back</a>

        <section class="book-detail-grid">
            <div class="left-column">
                <img src="" alt="" class="book-cover" id="detail">
                <div class="author-card">
                </div>
            </div>

            <div class="right-column">
                <div class="book-main-info">
                    <h1 class="animate-text" id="judul_buku"></h1>
                    <p class="author animate-text" id="penulis_buku"></p>
                    <div class="tags animate-text">
                        <span id="kategori_buku" class="bg-secondary text-white"></span>
                    </div>
                    <p class="synopsis animate-text" id="deskripsi_buku">
                        
                    </p>
                    <span class="badge text-bg-success" id="stok">New</span>
                    <span class="badge text-bg-danger" id="dipinjam">New</span>
                    
                    <div class="action-buttons animate-text">
                        <i class="bi bi-bookmark-star me-1 fs-2"></i>
                        <button class="btn btn-primary text-white" id="ajukan">PINJAM</button>
                    </div>
                </div>

            </div>
        </section>

        <section class="references">
            <h2 class="animate-text">Referensi</h2>
            <div class="slider-container">
                <button id="slideLeft" class="arrow">&lt;</button>
                <div id="slider" class="book-slider">

                </div>
                <button id="slideRight" class="arrow">&gt;</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/detail_buku.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
</body>
</html>
