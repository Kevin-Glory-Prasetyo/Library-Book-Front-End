<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Peminjaman</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>History Peminjaman</h2>
    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>No</th>
          <th>Judul Buku</th>
          <th>Tanggal Pinjam</th>
          <th>Tanggal Kembali</th>
          <th>Tanggal Pengembalian</th>
          <th>Status Peminjaman</th>
          <th>Status Pengembalian</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <!-- Data akan masuk di sini -->
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    function formatTanggal(dateStr) {
      if (!dateStr) return "-";
      const date = new Date(dateStr);
      return date.toLocaleDateString("id-ID");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // Ambil user login
        const userRes = await axios.get("http://localhost:8000/auth/checkLogin", { withCredentials: true });
        const idUser = userRes.data.user.id;
        console.log(idUser)

        // Ambil data peminjaman user
        const res = await axios.get(`http://localhost:8000/peminjaman/peminjaman/${idUser}`);
        const data = res.data.peminjaman; // sesuaikan dengan response API

        const tableBody = document.getElementById("history-body");

        data.forEach((pinjam, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${pinjam.judul_buku}</td>
            <td>${formatTanggal(pinjam.tanggal_pinjam)}</td>
            <td>${formatTanggal(pinjam.tanggal_kembali)}</td>
            <td>${formatTanggal(pinjam.tanggal_pengembalian)}</td>
            <td>${pinjam.status_peminjaman}</td>
            <td>${pinjam.status_pengembalian || "-"}</td>
            <td>
              ${pinjam.status_peminjaman === "dipinjam" ? 
                `<button class="btn btn-warning btn-sm kembalikan" data-id="${pinjam.id_peminjaman}">
                  Kembalikan </i>
                </button>` 
                : "-"}
            </td>
          `;
          tableBody.appendChild(row);
        });

        // Event delegation untuk tombol kembalikan
        document.addEventListener("click", async (e) => {
          const btn = e.target.closest(".kembalikan");
          if (!btn) return;

          const idPeminjaman = btn.dataset.id;
          try {
            await axios.patch(`http://localhost:8000/peminjaman/kembalikan/${idPeminjaman}`);
            window.location.reload();
          } catch (err) {
            console.error(err);
            alert("Gagal mengembalikan buku!");
          }
        });

      } catch (err) {
        console.error(err);
        alert("Gagal mengambil data peminjaman!");
      }
    });
  </script>
</body>
</html>
