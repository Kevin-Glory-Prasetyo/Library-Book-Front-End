        <div class="container-fluid pt-4 px-4">
          <div class="row g-4">
            <div class="col-sm-12 col-xl">
              <div class="bg-light rounded h-100 p-4">
                <h6 class="mb-4 fs-3 text-primary">Form Update Buku</h6>
                <div class="row">
                  <!-- Card Foto Buku -->
                  <div class="col-md-4 mb-3">
                    <div class="card">
                      <img
                        src=""
                        class="card-img-top"
                        alt="Foto Buku"
                        id="preview-foto"
                        height="350px"
                      />
                      <div class="card-body text-center">
                        <input
                          type="file"
                          class="form-control"
                          id="foto"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Form Input -->
                  <div class="col-md-8">
                    <form>
                      <div class="row">
                        <!-- Bagian kiri form -->
                        <div class="col-md-6">
                          <div class="mb-3">
                            <label for="judul_buku" class="form-label"
                              >Judul Buku</label
                            >
                            <input
                              type="text"
                              class="form-control"
                              id="judul_buku"
                              placeholder="Masukkan Judul"
                            />
                          </div>
                          <div class="mb-3">
                            <label for="penulis_buku" class="form-label"
                              >Penulis Buku</label
                            >
                            <input
                              type="text"
                              class="form-control"
                              id="penulis_buku"
                              placeholder="Masukkan Penulis"
                            />
                          </div>
                          <div class="mb-3">
                            <label for="kategori_buku" class="form-label"
                              >Kategori Buku</label
                            >
                            <select
                              class="form-select mb-3"
                              id="kategori_buku"
                            >
                              <option selected>---Pilih Kategori---</option>
                            </select>
                          </div>
                          <div class="mb-3">
                            <label for="penerbit_buku" class="form-label"
                              >Penerbit</label
                            >
                            <input
                              type="text"
                              class="form-control"
                              id="penerbit_buku"
                              placeholder="Masukkan Penerbit"
                            />
                          </div>
                        </div>

                        <!-- Bagian kanan form -->
                        <div class="col-md-6">
                          <div class="mb-3">
                            <label for="tahun_terbit" class="form-label"
                              >Tahun Terbit</label
                            >
                            <input
                              type="number"
                              class="form-control"
                              id="tahun_terbit"
                              placeholder="Masukkan Tahun Terbit"
                            />
                          </div>
                          <div class="mb-3">
                            <label for="stok_buku" class="form-label"
                              >Stok Buku</label
                            >
                            <input
                              type="text"
                              class="form-control"
                              id="stok_buku"
                              placeholder="Masukkan Stok"
                            />
                          </div>
                          <div class="mb-3">
                            <label for="deskripsi_buku" class="form-label"
                              >Deskripsi</label
                            >
                            <textarea
                            class="form-control"
                            id="deskripsi_buku"
                            placeholder="Masukkan Deskripsi">
                            </textarea>
                            
                          </div>
                        </div>
                      </div>

                      <div class="row mt-3">
                        <div class="col-12 text-end">
                          <a
                            type="button"
                            class="btn btn-secondary"
                            id="kembali"
                            href="data_buku.html"
                          >
                            Kembali
                          </a>
                          <button
                            type="submit"
                            class="btn btn-primary"
                            id="tambah"
                          >
                            Update
                          </button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
